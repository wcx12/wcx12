name: Quality

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://wcx12.github.io/wcx12
      SITE_TIME_ZONE: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate content and tests
        run: npm run validate

      - name: Check browser scripts
        run: |
          node --check site-data.js
          node --check script.js
          node --check homepage-i18n.js
          node --check research-canvas.js
          node --check repo-map.js
          node --check blog-src/assets/blog.js
          node --check scripts/build-blog.mjs
          node --check scripts/sync-github-repos.mjs
          node --check scripts/apply-research-config.mjs
          node --check scripts/research-config-schema.js

      - name: Rebuild generated site
        run: npm run build:site

      - name: Validate rebuilt site
        run: npm run validate

      - name: Package and validate Pages artifact
        run: npm run package:pages && npm run test:pages

      - name: Install browser for visitor-path tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify visitor paths
        run: npm run test:e2e && npm run test:links

      - name: Verify generated files are current
        run: git diff --exit-code -- index.html blog research projects publications zh resume publications.md rss.xml sitemap.xml

      - name: Compare performance with the pull-request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach output/perf-baseline-source "$BASE_SHA"
          npm --prefix output/perf-baseline-source ci --ignore-scripts
          npm --prefix output/perf-baseline-source run build:pages
          node scripts/qa/serve.mjs output/perf-baseline-source/output/pages 4284 &
          before_pid=$!
          node scripts/qa/serve.mjs output/pages 4283 &
          after_pid=$!
          trap 'kill "$before_pid" "$after_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:4284/wcx12/ -o /dev/null
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:4283/wcx12/ -o /dev/null
          node scripts/qa/performance.mjs ci-paired http://127.0.0.1:4283/wcx12/ http://127.0.0.1:4284/wcx12/

      - name: Retain performance evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-review
          path: |
            output/site-quality-20260926/ci-paired/performance/*.json
            output/site-quality-20260926/ci-paired/performance/*.html
          retention-days: 7
