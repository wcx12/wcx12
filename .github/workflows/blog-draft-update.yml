name: Blog draft updates disabled

on:
  workflow_dispatch:

permissions: {}

jobs:
  deprecated:
    runs-on: ubuntu-latest
    steps:
      - name: Reject deprecated public draft updates
        run: |
          echo "::error::Public workflow draft updates are disabled. Save drafts only to wcx12/wcx12-private-notes using the GitHub API; publish public content through the Contents API."
          exit 1
